# Access transformer for Electroblob's Wizardry.
# Widens access on a couple of vanilla fields so we don't need runtime reflection to reach them.

# ContainerMerchant#merchant - needed to get at the IMerchant a player is currently trading with when their trade
# GUI opens, so illegal (imbuement) enchanted book trades can be stripped out of it. See Imbuement#onPlayerOpenContainerEvent.
public net.minecraft.inventory.ContainerMerchant field_75178_e # merchant

# EntityVillager#buyingList - IMerchant#getRecipes() only ever returns a throwaway copy of this (see
# ForgeEventFactory#listTradeOffers), so the actual trade list has to be reached directly for the fix above to stick.
public net.minecraft.entity.passive.EntityVillager field_70963_i # buyingList
